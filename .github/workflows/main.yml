name: Build Santoni Kernel (KSU & DroidSpaces)

on:
  workflow_dispatch: # Mengaktifkan tombol manual di halaman Actions

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ksu # Memastikan GitHub Actions mengambil kode dari branch ksu
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev libssl-dev bison flex git libncurses-dev crossbuild-essential-arm64 lz4 liblz4-tool

    - name: Download AOSP Clang Toolchain
      run: |
        # Mengunduh Clang r450784d langsung menggunakan Git Clone (Lebih stabil & anti-eror)
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b android13-release $GITHUB_WORKSPACE/clang

    - name: Run Kernel Build
      run: |
        # Mengarahkan path langsung ke folder biner Clang r450784d hasil clone
        export PATH="$GITHUB_WORKSPACE/clang/clang-r450784d/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        make O=out vendor/msm8937-perf_defconfig
        make -j$(nproc --all) O=out


    - name: Upload Kernel Binary
      uses: actions/upload-artifact@v4
      with:
        name: Santoni-KSU-DroidSpaces-Kernel
        path: out/arch/arm64/boot/Image.gz-dtb # Format output biner kernel
