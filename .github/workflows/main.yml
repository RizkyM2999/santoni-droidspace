name: Build Santoni Kernel (KSU & DroidSpaces)

on:
  workflow_dispatch: # Mengaktifkan tombol manual di halaman Actions

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ksu # Memastikan GitHub Actions mengambil kode dari branch ksu

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev libssl-dev bison flex git libncurses-dev crossbuild-essential-arm64 lz4 liblz4-tool

    - name: Download AOSP Clang Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        # Menggunakan link arsip spesifik master-kernel-build agar terunduh sempurna
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784d.tar.gz
        tar -xf clang-r450784d.tar.gz
        rm -rf clang-r450784d.tar.gz

    - name: Run Kernel Build
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # 1. Membuat konfigurasi awal dari file yang telah Anda edit
        make O=out vendor/msm8937-perf_defconfig
        
        # 2. Mulai proses kompilasi kernel utama
        make -j$(nproc --all) O=out

    - name: Upload Kernel Binary
      uses: actions/upload-artifact@v4
      with:
        name: Santoni-KSU-DroidSpaces-Kernel
        path: out/arch/arm64/boot/Image.gz-dtb # Format output biner kernel
